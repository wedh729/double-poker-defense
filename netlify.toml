# Netlify 설정 — 정적 사이트 (빌드 없음, 루트 그대로 서빙)
# index.html은 항상 재검증(배포 즉시 반영), 에셋은 1일 캐시(?v= 버스터 병행)

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
